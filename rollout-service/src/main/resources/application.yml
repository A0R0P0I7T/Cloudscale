spring:
  application:
    name: rollout-service
  datasource:
    url: ${ROLLOUT_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_rollout}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

cloudscale:
  jwt:
    issuer: ${JWT_ISSUER:cloudscale-auth}
    secret: ${JWT_SECRET:}

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: CloudScale Rollout Service
