global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: cloudscale-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - gateway:8080
          - auth-service:8081
          - config-service:8082
          - rollout-service:8083
          - evaluation-service:8084
          - audit-service:8085
