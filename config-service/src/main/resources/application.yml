spring:
  application:
    name: config-service
  datasource:
    url: ${CONFIG_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_config}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: CloudScale Configuration Service
    phase: 5
