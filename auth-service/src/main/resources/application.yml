spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_auth}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: false

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: CloudScale Auth Service
    phase: 2
