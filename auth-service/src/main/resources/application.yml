spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_auth}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration

cloudscale:
  jwt:
    issuer: ${JWT_ISSUER:cloudscale-auth}
    secret: ${JWT_SECRET:}
    ttl-seconds: ${JWT_TTL_SECONDS:900}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: CloudScale Auth Service
