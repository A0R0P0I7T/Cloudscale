spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**
          order: 0
        - id: evaluation-service
          uri: ${EVALUATION_SERVICE_BASE_URL:http://localhost:8084}
          predicates:
            - Path=/api/v1/organizations/*/projects/*/environments/*/features/*/evaluate
          order: 1
        - id: rollout-service
          uri: ${ROLLOUT_SERVICE_BASE_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/organizations/*/rollouts/**
          order: 2
        - id: audit-service
          uri: ${AUDIT_SERVICE_BASE_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/organizations/*/audit-events/**
          order: 3
        - id: config-service
          uri: ${CONFIG_SERVICE_BASE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/organizations/**
          order: 10
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:4200}
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true

cloudscale:
  jwt:
    issuer: ${JWT_ISSUER:cloudscale-auth}
    secret: ${JWT_SECRET:}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: CloudScale API Gateway
