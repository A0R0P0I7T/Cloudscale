spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_audit}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: cloudscale-audit-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "com.cloudscale.contracts.configuration,com.cloudscale.contracts.rollout"

cloudscale:
  jwt:
    issuer: ${JWT_ISSUER:cloudscale-auth}
    secret: ${JWT_SECRET:}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

info:
  app:
    name: CloudScale Audit Service
