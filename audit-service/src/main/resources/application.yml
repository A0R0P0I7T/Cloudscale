spring:
  application:
    name: audit-service
  datasource:
    url: ${AUDIT_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:15432/cloudscale_audit}}
    username: ${POSTGRES_USER:cloudscale}
    password: ${POSTGRES_PASSWORD:change-me}
    hikari:
      maximum-pool-size: 5
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

server:
  port: ${SERVER_PORT:8085}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

info:
  app:
    name: CloudScale Audit Service
    phase: 2
